<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src http://127.0.0.1:*; connect-src http://127.0.0.1:*; img-src 'self' data:"
    />
    <title>Support Desk</title>
    <link rel="stylesheet" href="../../shared/ui/styles.css" />
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body>
    <div class="sd-app">
      <aside class="sd-sidebar">
        <div class="sd-brand">
          <div class="sd-brand__mark">
            <svg width="20" height="20" viewBox="0 0 1024 1024" aria-hidden="true" style="display: block">
              <mask id="sd-logo-cut">
                <rect width="1024" height="1024" fill="#ffffff" />
                <path
                  fill="none"
                  stroke="#000000"
                  stroke-width="84"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M390 476L472 558L648 364"
                />
              </mask>
              <path
                fill="currentColor"
                mask="url(#sd-logo-cut)"
                d="M342 232H682A150 150 0 0 1 832 382V542A150 150 0 0 1 682 692H500L342 832V692H342A150 150 0 0 1 192 542V382A150 150 0 0 1 342 232Z"
              />
            </svg>
          </div>
          <div>
            <div class="sd-brand__name">Support Desk</div>
            <div class="sd-brand__sub">клиентская поддержка</div>
          </div>
        </div>
        <nav class="sd-stack" id="nav" style="gap: 2px"></nav>
        <div class="sidebar-foot">
          <span class="health health--unknown" id="health-indicator"></span>
          <span id="health-summary">проверяю модули…</span>
        </div>
      </aside>

      <div class="sd-main">
        <header class="sd-topbar">
          <div class="topbar-text">
            <div class="topbar-title" id="module-title">Обзор</div>
            <div class="topbar-subtitle" id="module-subtitle">Восемь модулей клиентской поддержки в одном окне</div>
          </div>
          <div class="topbar-actions">
            <button class="topbar-button" id="refresh" type="button" title="Проверить связь с модулями">
              Обновить
            </button>
            <span class="topbar-badge">desktop</span>
          </div>
        </header>

        <main class="workspace">
          <section class="overview" id="overview">
            <div class="overview-head">
              <h1 class="overview-title">Рабочее пространство оператора</h1>
              <p class="overview-desc">
                Восемь приложений на одном бэкенде: PHP 8.3 и Yii2 REST отдают данные, React 18 показывает интерфейс.
                Выберите раздел слева или карточку ниже.
              </p>
            </div>
            <div class="overview-grid" id="overview-grid"></div>
          </section>
          <iframe id="frame" class="frame" title="Модуль" hidden></iframe>
        </main>
      </div>
    </div>
    <script src="icons.js"></script>
    <script src="app.js"></script>
  </body>
</html>
